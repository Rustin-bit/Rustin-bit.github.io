<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Poet Ranking</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<link rel="stylesheet" href="/static/style.css?v=2">
</head>
<style>
body {
  overflow: hidden;
}
</style>
<body>
<a href="https://adp.cloud.tencent.com/adp/?spaceId=default_space#/app/knowledge/app-config?appid=2031381381141682368&appType=knowledge_qa&spaceId=default_space" 
   class="agent-container"
   target="_blank">
    <div class="agent-circle"></div>
    <img src="/static/Yee.svg" class="agent-img">
    <div class="agent-bubble">
        💡 Ask Yee about Tang Poetry
    </div>
</a>

<h1 class="section-title">
    <span lang="en">
        Top 20 Tang Poets     
    </span>
</h1>

<div id="chart" style="width:1200px;height:700px;margin:auto;"></div>

<script>

fetch("/poet_rank")
.then(res => res.json())
.then(data => {

    const names = data.map(d => d.name);
    const values = data.map(d => d.value);

    const chart = echarts.init(document.getElementById("chart"));

    const option = {

        textStyle: {
            fontFamily: "FontChinese",
        },

        xAxis: {
            type: 'value',
            axisLabel: {
                fontFamily: 'FontEnglish',
                color: "#3a2c1b",
                fontSize: 15
            }
        },

        yAxis: {
            type: 'category',
            data: names,
            inverse: true,   // 🔥 排名高的在上面
            axisLabel: {
                fontSize: 15,
                color: "#3a2c1b"
            }
        },

        series: [
            {
                type: 'bar',
                data: values,
                itemStyle: {
                    color: function(params) {
                        const i = params.dataIndex;

                        if (i == 0) return "#5a0f0f";
                        if (i == 1) return "#8b3a2b";
                        if (i == 2) return "#c9971a";
                        return "#f5d76e";

                    }
                },
                label: {
                    show: true,
                    position: 'right',
                    fontFamily: 'FontEnglish'

                }
            }
        ]

    };

    chart.setOption(option);

    chart.on('click', function(params) {

        const poet = params.name;  // 获取诗人名字

        window.location.href = "/poet?name=" + encodeURIComponent(poet);

    });

});

</script>

</body>
</html>
