name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vue-app/package-lock.json

      - name: Install dependencies
        working-directory: vue-app
        run: npm ci

      - name: Determine base path
        id: base
        # 用户/组织主页仓库（<用户名>.github.io）部署在根路径 https://<用户名>.github.io/，
        # 其余仓库是项目页，部署在 https://<用户名>.github.io/<仓库名>/，
        # 二者 Vite 的 base 配置不同，这里按仓库名自动判断。
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: vue-app
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vue-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
